spring:
  application:
    name: banking-service
  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-in-production-env-vars-only}
  expiration-ms: 3600000

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/bank
    username: root
    password: IAmBoss@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      acks: all
      retries: 10

      properties:
        enable.idempotence: true
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        linger.ms: 5

  app:
    events:
      kafka-enabled: ${KAFKA_ENABLED:false}

  data:
    redis:
      host: localhost
      port: 6379

# Dev profile assumes no Kafka/Redis running locally (see KafkaConfig's
# @Profile("!dev") guard for why startup no longer blocks on Kafka).
# Silence the Redis health indicator too so /actuator/health and the
# logs stay clean without a local Redis instance.
management:
  health:
    redis:
      enabled: false

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.bank: DEBUG

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:bank_app}
    password: ${SPRING_DATASOURCE_PASSWORD:changeit}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
